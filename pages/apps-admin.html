<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>앱과 서비스 글 관리</title><link rel="stylesheet" href="/assets/css/style.css"></head><body><main class="container"><h1>앱과 서비스 글 관리</h1><p>관리자 키는 이 화면을 닫으면 지워집니다.</p><label>관리자 키 <input id="key" type="password" autocomplete="off"></label> <button id="load">목록 불러오기</button><p id="status" role="status"></p><ul id="list"></ul><button id="new">새 글</button><form id="form"><h2 id="heading">새 글</h2><label>제목 <input id="title" maxlength="100" required></label><p>본문 블록은 순서대로 표시됩니다. 링크와 이미지는 기존 블록을 보존하며 내용을 바꿀 수 있습니다.</p><div id="blocks"></div><button type="button" id="addText">문단 추가</button> <button type="button" id="addLink">링크 추가</button><p><button type="submit">저장</button> <button type="button" id="delete" hidden>삭제</button></p></form></main><script src="/assets/js/apps-admin.js"></script></body></html>
